<div class="np-page">
  <div class="np-page-header">
    <div>
      <div class="np-eyebrow"><i class="pi pi-send"></i> Eyebrow</div>
      <div class="np-page-title">Page Title</div>
      <div class="np-page-subtitle">Page Subtitle</div>
    </div>
    <button class="np-btn np-btn--primary" [permAction]="perm.canCreate(PAGE_CODE)" (click)="publish()">
      <i class="pi pi-send"></i> Publish Btn
    </button>
  </div>

  <p-message *ngIf="status" [severity]="status.type" [text]="status.message"></p-message>

  <div class="np-grid-2">
    <!-- Payload form -->
    <div class="np-card">
      <div class="np-card-header">
        <div class="np-card-title"><i class="pi pi-bolt"></i> Payload Title</div>
      </div>
      <div class="np-card-body">
        <form class="np-form" [formGroup]="form">
          <div class="np-form-row">
            <div class="np-field">
              <label class="np-label">Tenant Id <span class="np-muted" style="font-size:11px">(Optional)</span></label>
              <input pInputText formControlName="tenantId" placeholder="Tenant Id Placeholder" />
            </div>
            <div class="np-field">
              <label class="np-label">Event Type <span style="color:var(--s-red)">*</span></label>
              <p-select
                [options]="eventTypeOptions"
                formControlName="eventType"
                placeholder="Event Type Placeholder"
                [filter]="true"
              ></p-select>
              <span class="np-hint" *ngIf="selectedEventType">
                Expected: <span class="np-code">{{ selectedEventType.expectedPayload || '{}' }}</span>
              </span>
            </div>
          </div>
          <div class="np-field">
            <label class="np-label">Data <span class="np-muted" style="font-size:11px">(Data Hint Inline)</span></label>
            <textarea pTextarea formControlName="data" rows="6"
              placeholder='{ "userId": "123", "orderId": "456" }'></textarea>
            <span class="np-hint">Data Hint</span>
          </div>
          <div class="np-form-row">
            <div class="np-field">
              <label class="np-label">Correlation Id</label>
              <input pInputText formControlName="correlationId" />
            </div>
            <div class="np-field">
              <label class="np-label">Override Recipient</label>
              <input pInputText formControlName="overrideRecipientId" />
            </div>
          </div>
          <div class="np-form-row">
            <div class="np-field">
              <label class="np-label">Language Code</label>
              <input pInputText formControlName="languageCode" placeholder="en" />
            </div>
            <div class="np-field">
              <label class="np-label">Scheduled At <span class="np-muted" style="font-size:11px">(Scheduled At Hint Inline)</span></label>
              <input pInputText formControlName="scheduledAt" placeholder="2026-03-24T08:00:00Z" />
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Result -->
    <div class="np-card">
      <div class="np-card-header">
        <div class="np-card-title"><i class="pi pi-eye"></i> Result Title</div>
      </div>
      <div class="np-card-body">
        <div *ngIf="!result" class="np-empty">
          <i class="pi pi-send"></i>
          <div class="np-empty-title">No Result Title</div>
          <p class="np-muted" style="font-size:12px">No Result Desc</p>
        </div>
        <pre *ngIf="result" style="font-size:12px;color:var(--s-text);background:var(--s-bg-3);padding:14px;border-radius:6px;overflow:auto;margin:0">{{ result | json }}</pre>
      </div>
      <div class="np-card-body" style="padding-top:0;border-top:1px solid var(--s-border)">
        <div class="np-row-list" style="margin-top:0">
          <div class="np-row-item">
            <div class="np-row-icon"><i class="pi pi-code"></i></div>
            <div class="np-row-body">
              <div class="np-row-name">Vars Title</div>
              <div class="np-row-meta">Vars Desc</div>
            </div>
          </div>
          <div class="np-row-item">
            <div class="np-row-icon"><i class="pi pi-clock"></i></div>
            <div class="np-row-body">
              <div class="np-row-name">Scheduled Title</div>
              <div class="np-row-meta">Scheduled Desc</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
